backend:
  name: github
  repo: grdnwebproject-ship-it/Webproject
  branch: main

site_url: https://grouperenaissancedunord.netlify.app
logo_url: /images/logo.png

media_folder: grdn-site/site/images/uploads
public_folder: /images/uploads

media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 1600
          height: 1600

collections:
  - name: website
    label: Website content
    format: json
    files:
      - name: news
        label: "1. News posts (Home page)"
        file: grdn-site/site/content/news.json
        fields:
          - label: News posts
            name: items
            widget: list
            summary: "{{fields.date}} - {{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Date, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
              - { label: Text, name: text, widget: text, required: false, hint: "Press Enter to start a new paragraph." }
              - label: Pictures
                name: images
                widget: list
                required: false
                hint: "Add as many photos as you like. The first one is the main picture."
                field: { label: Picture, name: image, widget: image }
              - { label: "Video link (YouTube or Facebook)", name: video, widget: string, required: false, hint: "Paste the web address of the video. Leave empty if none." }
      - name: events
        label: "2. Upcoming events"
        file: grdn-site/site/content/events.json
        fields:
          - label: Events
            name: items
            widget: list
            summary: "{{fields.date}} - {{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Date, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", hint: "Events disappear from the site after this date." }
              - { label: Time (e.g. 9:00 am), name: time, widget: string, required: false }
              - { label: Place, name: place, widget: string, required: false }
              - { label: Details, name: text, widget: text, required: false }
              - { label: Picture, name: image, widget: image, required: false }
      - name: achievements
        label: "3. Our achievements"
        file: grdn-site/site/content/achievements.json
        fields:
          - label: Achievements
            name: items
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Big number or date (optional, e.g. 22 or 60 days), name: stat, widget: string, required: false }
              - { label: Title, name: title, widget: string }
              - { label: Story, name: text, widget: text, hint: "Press Enter to start a new paragraph." }
              - label: Pictures
                name: images
                widget: list
                required: false
                field: { label: Picture, name: image, widget: image }
              - { label: "Video link (YouTube or Facebook)", name: video, widget: string, required: false }
      - name: gallery
        label: "4. Gallery photos"
        file: grdn-site/site/content/gallery.json
        fields:
          - label: Photos
            name: items
            widget: list
            summary: "{{fields.caption}}"
            hint: "Photos added to News and Achievements also appear in the Gallery automatically. Use this list for extra photos."
            fields:
              - { label: Photo, name: image, widget: image }
              - { label: Caption, name: caption, widget: string, required: false }
      - name: team
        label: "5. Our team (Home page)"
        file: grdn-site/site/content/team.json
        fields:
          - label: Team members
            name: items
            widget: list
            summary: "{{fields.role}} {{fields.name}}"
            fields:
              - { label: Role (e.g. President), name: role, widget: string }
              - { label: Name, name: name, widget: string, required: false }
              - { label: Photo, name: photo, widget: image, required: false }
      - name: testimonials
        label: "6. Messages from members and collaborators (About us page)"
        file: grdn-site/site/content/testimonials.json
        fields:
          - label: Messages
            name: items
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: Message from, name: kind, widget: select, options: ["Member", "Collaborator"] }
              - { label: Name, name: name, widget: string }
              - { label: Role or title (optional), name: role, widget: string, required: false }
              - { label: Headline (optional short quote), name: headline, widget: string, required: false }
              - { label: Message, name: quote, widget: text }
              - { label: Photo, name: photo, widget: image, required: false }
      - name: site
        label: "7. Site info, About text and contact details"
        file: grdn-site/site/content/site.json
        fields:
          - { label: Name, name: name, widget: string }
          - { label: Tagline, name: tagline, widget: string }
          - { label: About us text (Home page), name: about, widget: text }
          - { label: Message from the President (About us page), name: president_message, widget: text, required: false }
          - { label: President's name and title (signature), name: president_signature, widget: string, required: false }
          - { label: President's photo, name: president_photo, widget: image, required: false }
          - { label: Address, name: address, widget: string, required: false }
          - { label: Phone, name: phone, widget: string, required: false }
          - { label: Email, name: email, widget: string, required: false }
          - { label: Facebook page link, name: facebook, widget: string, required: false }
          - { label: "Contact form address (from Formspree, optional)", name: form_endpoint, widget: string, required: false, hint: "Leave empty to use a simple 'send by email' form." }
