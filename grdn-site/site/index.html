<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Groupe Renaissance du Nord</title>
<link rel="icon" href="images/logo.png">
<style>
:root{color-scheme:light;--bg:#fbf8f4;--card:#fff;--tx:#23302e;--mu:#5f6f6c;--ac:#1b5a96;--ac2:#d9434a;--bd:#e6e0d8}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#121a24;--card:#1b2634;--tx:#eaf0f6;--mu:#9fb1c4;--ac:#6fa8e0;--ac2:#f07a7a;--bd:#2b3a4c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Georgia,"Times New Roman",serif}
h1,h2,h3,nav,button,.tag,.btn{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--bd);z-index:5}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 20px}
.logo{display:flex;align-items:center;font:700 19px system-ui,sans-serif;color:var(--ac);text-decoration:none}
.logo img{height:48px;margin-right:10px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:6px 12px;border-radius:99px;color:var(--tx);text-decoration:none;font-size:14px}
nav a.on,nav a:hover{background:var(--ac);color:#fff}
.hero{background:linear-gradient(135deg,var(--ac),#0e2f57);color:#fff;padding:64px 0;text-align:center}
.hero img{width:150px;height:150px;background:#fff;border-radius:50%;padding:6px;margin-bottom:14px}
.hero h1{font-size:clamp(30px,6vw,46px);margin:0 0 12px}.hero p{font-size:19px;max-width:580px;margin:0 auto 22px;opacity:.95}
main{padding:34px 0 56px}h2{font-size:28px;margin:0 0 6px}.sub{color:var(--mu);margin:0 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;overflow:hidden}
.card img{width:calc(100% + 36px);margin:-18px -18px 12px;display:block;max-height:230px;object-fit:cover}
.card h3{margin:0 0 4px;font-size:18px}.tag{font-size:13px;color:var(--ac2);font-weight:600}
.stat{font:700 30px system-ui,sans-serif;color:var(--ac)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.gal figure{margin:0;background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}.gal figcaption{padding:8px 12px;font-size:14px;color:var(--mu)}
.btn{background:var(--ac2);color:#fff;border-radius:99px;padding:9px 18px;font-size:14px;text-decoration:none;display:inline-block}
.pil{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:28px 0}
.pil div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;text-align:center;font:600 14px system-ui,sans-serif}
.pil span{display:block;font-size:26px}.empty{color:var(--mu);font-style:italic}.ct p{margin:6px 0}.pres{margin-top:18px;border-left:5px solid var(--ac2)}.pres h3{font-size:20px;color:var(--ac);margin-bottom:10px}.sig{font-style:italic;color:var(--mu)}
footer{text-align:center;color:var(--mu);padding:24px;border-top:1px solid var(--bd);font-size:14px}
</style>
</head>
<body>
<header><div class="wrap top"><a class="logo" href="#home" id="brand"></a><nav id="nav"></nav></div></header>
<div id="app"><p class="wrap empty">Loading…</p></div>
<footer id="foot"></footer>
<script>
const $=s=>document.querySelector(s),D={};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const para=s=>esc(s).split(/\n+/).map(p=>`<p>${p}</p>`).join('');
const TABS=[['home','Home'],['about','About us'],['achievements','Our achievements'],['gallery','Gallery'],['events','Upcoming events'],['contact','Contact us']];
const items=k=>(D[k]&&D[k].items)||[];
const today=new Date().toISOString().slice(0,10);
const fmt=d=>{try{return new Date(d+'T00:00').toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'})}catch(e){return d||''}};
const page=(t,sub,body)=>`<main><div class="wrap"><h2>${t}</h2><p class="sub">${sub}</p>${body}</div></main>`;
const PIL=[['📚','Education'],['🌳','Environmental protection'],['🏠','Social housing'],['♿','Disability support'],['❤️','Health and wellness'],['🤝','Poverty alleviation']];
const pil=`<div class="pil">${PIL.map(p=>`<div><span>${p[0]}</span>${p[1]}</div>`).join('')}</div>`;
const S=()=>D.site||{};
const V={
 home:()=>`<div class="hero"><div class="wrap"><img src="images/logo.png" alt="Logo"><h1>${esc(S().name)}</h1><p>${esc(S().tagline)}</p><a class="btn" href="#events">See upcoming events</a></div></div><div class="wrap">${pil}<div class="card">${para(S().about)}</div></div>`+
  page('Latest news','What we have been up to lately.',`<div class="grid">${[...items('news')].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(p=>`<div class="card">${p.image?`<img src="${esc(p.image)}" alt="">`:''}<span class="tag">${esc(fmt(p.date))}</span><h3>${esc(p.title)}</h3>${para(p.text)}</div>`).join('')||'<p class="empty">No news yet. Check back soon!</p>'}</div>`),
 about:()=>page('About us','Our six pillars and a message from our President.',pil+(S().president_message?`<div class="card pres"><h3>Message from the President</h3>${para(S().president_message)}${S().president_signature?`<p class="sig">${esc(S().president_signature)}</p>`:''}</div>`:`<div class="card">${para(S().about)}</div>`)),
 achievements:()=>page('Our achievements','What we have achieved together.',`<div class="grid">${items('achievements').map(a=>`<div class="card"><div class="stat">${esc(a.stat)}</div><h3>${esc(a.title)}</h3>${para(a.text)}</div>`).join('')||'<p class="empty">Coming soon.</p>'}</div>`),
 gallery:()=>page('Gallery','Moments from our work.',`<div class="gal">${items('gallery').map(g=>`<figure><img src="${esc(g.image)}" alt="${esc(g.caption)}" loading="lazy"><figcaption>${esc(g.caption)}</figcaption></figure>`).join('')||'<p class="empty">Photos coming soon.</p>'}</div>`),
 events:()=>page('Upcoming events','Come and join us.',`<div class="grid">${items('events').filter(e=>(e.date||'')>=today).sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<div class="card">${e.image?`<img src="${esc(e.image)}" alt="">`:''}<span class="tag">${esc(fmt(e.date))}${e.place?' · '+esc(e.place):''}</span><h3>${esc(e.title)}</h3>${para(e.text)}</div>`).join('')||'<p class="empty">No upcoming events right now. Check back soon!</p>'}</div>`),
 contact:()=>{const s=S();return page('Contact us','We would love to hear from you.',`<div class="card ct">${s.email?`<p><b>Email:</b> <a href="mailto:${esc(s.email)}">${esc(s.email)}</a></p>`:''}${s.phone?`<p><b>Phone:</b> <a href="tel:${esc(String(s.phone).replace(/[^+\d]/g,''))}">${esc(s.phone)}</a></p>`:''}${s.address?`<p><b>Address:</b> ${esc(s.address)} · <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.address)}">View on map</a></p>`:''}${(s.email||s.phone||s.address)?'':'<p class="empty">Contact details coming soon.</p>'}</div>`)}};
function render(){
 const h=(location.hash||'#home').slice(1),k=V[h]?h:'home';
 $('#brand').innerHTML='<img src="images/logo.png" alt="">'+esc(S().name||'Groupe Renaissance du Nord');
 $('#nav').innerHTML=TABS.map(t=>`<a href="#${t[0]}" class="${t[0]==k?'on':''}">${t[1]}</a>`).join('');
 $('#app').innerHTML=V[k]();
 const s=S();$('#foot').innerHTML='© '+new Date().getFullYear()+' '+esc(s.name||'')+[s.address,s.phone,s.email].filter(Boolean).map(x=>'<br>'+esc(x)).join('');
}
addEventListener('hashchange',()=>{render();scrollTo(0,0)});
Promise.all(['site','news','achievements','gallery','events'].map(k=>fetch('content/'+k+'.json',{cache:'no-cache'}).then(r=>r.json()).then(j=>D[k]=j).catch(()=>D[k]={}))).then(render);
</script>
</body>
</html>
