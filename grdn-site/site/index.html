<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Groupe Renaissance du Nord</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;--bg:#fbf8f4;--card:#fff;--tx:#23302e;--mu:#5f6f6c;--ac:#1e4f8f;--ac2:#d9482b;--bd:#e6e0d8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#141b1a;--card:#1d2726;--tx:#eaf1ef;--mu:#9db0ac;--ac:#6aa5e8;--ac2:#f08b72;--bd:#2d3a38}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#141b1a;--card:#1d2726;--tx:#eaf1ef;--mu:#9db0ac;--ac:#6aa5e8;--ac2:#f08b72;--bd:#2d3a38}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Georgia,"Times New Roman",serif}
h1,h2,h3,nav,button,label,.tag{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--bd);z-index:5}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 20px}
.logo{font:700 20px system-ui,sans-serif;color:var(--ac);text-decoration:none}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:6px 12px;border-radius:99px;color:var(--tx);text-decoration:none;font-size:14px}
nav a.on,nav a:hover{background:var(--ac);color:#fff}
.hero{background:linear-gradient(135deg,var(--ac),#0f2f5c);color:#fff;padding:72px 0;text-align:center}
.hero h1{font-size:clamp(30px,6vw,48px);margin:0 0 12px}.hero p{font-size:19px;max-width:560px;margin:0 auto 22px;opacity:.95}
main{padding:36px 0 60px}h2{font-size:28px;margin:0 0 6px}.sub{color:var(--mu);margin:0 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;overflow:hidden}
.card img{width:calc(100% + 36px);margin:-18px -18px 12px;display:block;max-height:220px;object-fit:cover}
.card h3{margin:0 0 4px;font-size:18px}.tag{font-size:13px;color:var(--ac2);font-weight:600}
.stat{font:700 30px system-ui,sans-serif;color:var(--ac)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.gal figure{margin:0;background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}.gal figcaption{padding:8px 12px;font-size:14px;color:var(--mu)}
.btn{background:var(--ac2);color:#fff;border:0;border-radius:99px;padding:9px 18px;font-size:14px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn.sm{padding:4px 12px;font-size:12px}
.adm{background:#fef3c7;color:#422006;padding:8px 20px;font:14px system-ui,sans-serif;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tools{display:flex;gap:6px;margin-top:10px}.empty{color:var(--mu);font-style:italic}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.box{background:var(--card);border-radius:14px;padding:22px;width:100%;max-width:480px;max-height:90vh;overflow:auto}
.box h3{margin-top:0}.box label{display:block;font-size:14px;margin-bottom:12px}
.box input,.box textarea{width:100%;margin-top:4px;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:flex;gap:8px}footer{text-align:center;color:var(--mu);padding:24px;border-top:1px solid var(--bd);font-size:14px}
.logo img{height:44px;width:auto;vertical-align:middle;margin-right:8px}.hlogo{width:130px;height:auto;background:#fff;border-radius:50%;padding:6px;margin-bottom:14px}.pil{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:28px}.pil div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;text-align:center;font:600 14px system-ui,sans-serif}.pil span{display:block;font-size:26px}.ct p{margin:6px 0}
</style>
</head>

<script type="application/json" id="data">{"s": {"name": "Groupe Renaissance du Nord", "tagline": "Creating a brighter future for all: honestly, respectfully, sustainably and transparently.", "about": "Welcome to Groupe Renaissance du Nord, a non-governmental organization dedicated to creating a brighter future for all. Our six main pillars focus on education, environmental protection, social housing, disability support, health and wellness, and poverty alleviation. We believe in doing things differently - honestly, respectfully, sustainably, and transparently.\nAt Groupe Renaissance du Nord, we are passionate about making a positive impact on society. We believe that education is the foundation of a prosperous and equitable society, and we provide resources and support to underprivileged children to ensure they have the opportunity to learn and grow. We also advocate for policies that promote access to quality education for all children, regardless of their socioeconomic status.\nWe recognize that the health of our planet is essential to our collective well-being, and we are committed to protecting and conserving the environment. Our organization raises awareness about environmental issues and promotes sustainable practices. We engage in initiatives to reduce our carbon footprint and minimize our impact on the natural world.\nSocial housing is another key focus of our work. We believe that everyone deserves a safe and affordable place to call home, and we work to provide housing options for those who are most in need. Our organization collaborates with other groups to offer job training, financial education, and other resources that help families achieve long-term stability.\nWe are also dedicated to supporting people with disabilities. Our organization promotes inclusion and advocates for policies that advance the rights of people with disabilities. We provide resources and opportunities to help individuals with disabilities live fulfilling lives.\nFinally, we believe that health and wellness are essential to a thriving society. Our organization offers a range of initiatives, including health fairs, workshops, and educational programs, to promote healthy living and prevent illness. We support sustainable means of poverty alleviation, such as microfinance programs, to help individuals and families build their own businesses and achieve financial independence.\nJoin us on our mission to create a more equitable, sustainable, and just world for all. Together, we can build a brighter future for ourselves and future generations.", "email": "", "phone": "", "address": ""}, "posts": [{"id": "p1", "title": "Welcome to our new website", "text": "Follow our latest news, events and achievements here.", "date": "2026-11-01", "image": ""}], "achievements": [], "gallery": [], "events": []}</script>

let admin=false,AS=null,A=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const para=s=>esc(s).split(/\n+/).map(p=>`<p>${p}</p>`).join('');
const TABS=[['home','Home'],['about','About us'],['achievements','Our achievements'],['gallery','Gallery'],['events','Upcoming events'],['contact','Contact us']];
const SCHEMA={
 posts:['news post',[['title','Title'],['date','Date','date'],['text','Text','area'],['image','Add a picture (optional)','image']]],
 achievements:['achievement',[['stat','Big number (e.g. 500+)'],['title','Title'],['text','Description','area']]],
 gallery:['photo',[['image','Photo','image'],['caption','Caption']]],
 events:['event',[['title','Title'],['date','Date','date'],['place','Place'],['text','Details','area']]]};
const fmt=d=>{try{return new Date(d+'T00:00').toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'})}catch(e){return d}};
const tools=(c,id)=>admin?`<div class="tools" data-admin><button class="btn sm ghost" data-a="edit" data-c="${c}" data-id="${id}">Edit</button><button class="btn sm ghost" data-a="del" data-c="${c}" data-id="${id}">Remove</button></div>`:'';
const addBtn=c=>admin?`<p data-admin><button class="btn" data-a="edit" data-c="${c}" data-id="">+ Add ${SCHEMA[c][0]}</button></p>`:'';
const page=(t,sub,body)=>`<main><div class="wrap"><h2>${t}</h2><p class="sub">${sub}</p>${body}</div></main>`;
const byDate=(a,b)=>(b.date||'').localeCompare(a.date||'');
const V={
 home:()=>`<div class="hero"><div class="wrap"><img class="hlogo" src="${LOGO}" alt="Logo"><h1>${esc(S.s.name)}</h1><p>${esc(S.s.tagline)}</p><a class="btn" href="#events">See upcoming events</a></div></div>`+
  `<div class="wrap" style="padding-top:32px"><div class="pil"><div><span>📚</span>Education</div><div><span>🌳</span>Environment</div><div><span>🏠</span>Social housing</div><div><span>♿</span>Disability support</div><div><span>❤️</span>Health &amp; wellness</div><div><span>🤝</span>Poverty alleviation</div></div></div>`+page('Latest news','What we have been up to lately.',addBtn('posts')+`<div class="grid">${[...S.posts].sort(byDate).map(p=>`<div class="card">${p.image?`<img src="${esc(p.image)}" alt="">`:''}<span class="tag">${esc(fmt(p.date))}</span><h3>${esc(p.title)}</h3>${para(p.text)}${tools('posts',p.id)}</div>`).join('')||'<p class="empty">No news yet.</p>'}</div>`),
 about:()=>page('About us','Who we are and why we do it.',`<div class="card">${para(S.s.about)}</div>`),
 achievements:()=>page('Our achievements','What we have achieved together, thanks to our supporters.',addBtn('achievements')+`<div class="grid">${S.achievements.map(a=>`<div class="card"><div class="stat">${esc(a.stat)}</div><h3>${esc(a.title)}</h3>${para(a.text)}${tools('achievements',a.id)}</div>`).join('')||'<p class="empty">Nothing here yet.</p>'}</div>`),
 gallery:()=>page('Gallery','Moments from our work.',addBtn('gallery')+`<div class="gal">${S.gallery.map(g=>`<figure><img src="${esc(g.image)}" alt="${esc(g.caption)}" loading="lazy"><figcaption>${esc(g.caption)}${tools('gallery',g.id)}</figcaption></figure>`).join('')||'<p class="empty">No photos yet.</p>'}</div>`),
 events:()=>page('Upcoming events','Come and join us.',addBtn('events')+`<div class="grid">${[...S.events].sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(e=>`<div class="card"><span class="tag">${esc(fmt(e.date))}${e.place?' · '+esc(e.place):''}</span><h3>${esc(e.title)}</h3>${para(e.text)}${tools('events',e.id)}</div>`).join('')||'<p class="empty">No upcoming events right now. Check back soon!</p>'}</div>`),
 contact:()=>page('Contact us','We would love to hear from you.',`<div class="card ct">${S.s.email?`<p><b>Email:</b> <a href="mailto:${esc(S.s.email)}">${esc(S.s.email)}</a></p>`:''}${S.s.phone?`<p><b>Phone:</b> ${esc(S.s.phone)}</p>`:''}${S.s.address?`<p><b>Address:</b> ${esc(S.s.address)}</p>`:''}${(S.s.email||S.s.phone||S.s.address)?'':'<p class="empty">Contact details coming soon.</p>'}</div>`)};
function render(){
 const h=(location.hash||'#home').slice(1),k=V[h]?h:'home';
 $('#brand').innerHTML='<img src="'+LOGO+'" alt="">'+esc(S.s.name);document.title=S.s.name;
 $('#nav').innerHTML=TABS.map(t=>`<a href="#${t[0]}" class="${t[0]==k?'on':''}">${t[1]}</a>`).join('');
 $('#app').innerHTML=(admin?`<div class="adm" data-admin>✏️ Admin mode: your changes go live when you save. <button class="btn sm" data-a="site">Edit site info &amp; About text</button></div>`:'')+V[k]();
 $('#foot').textContent='© '+new Date().getFullYear()+' '+S.s.name;
}
function build(){const c=document.documentElement.cloneNode(true);c.querySelector('#app').innerHTML='';c.querySelector('#foot').innerHTML='';c.querySelector('#nav').innerHTML='';c.querySelector('#brand').innerHTML='';c.querySelectorAll('[data-admin]').forEach(e=>e.remove());c.querySelector('#data').textContent=JSON.stringify(S).replace(/</g,'\\u003c');return '<!DOCTYPE html>\n'+c.outerHTML}
async function commit(){await A.publish(build())}
function form(title,fields,v,save){
 const m=document.createElement('div');m.className='modal';m.dataset.admin=1;
 m.innerHTML=`<div class="box"><h3>${esc(title)}</h3>${fields.map(f=>`<label>${f[1]}${f[2]=='area'?`<textarea name="${f[0]}" rows="5">${esc(v[f[0]])}</textarea>`:f[2]=='image'?`<input type="file" name="${f[0]}" accept="image/*">${v[f[0]]?'<small>Current photo is kept unless you pick a new one.</small>':''}`:`<input name="${f[0]}" type="${f[2]||'text'}" value="${esc(v[f[0]])}">`}</label>`).join('')}<div class="row"><button class="btn" id="ok">Save &amp; publish</button><button class="btn ghost" id="no">Cancel</button></div><p id="msg"></p></div>`;
 document.body.appendChild(m);
 m.querySelector('#no').onclick=()=>m.remove();
 m.querySelector('#ok').onclick=async()=>{
  const b=m.querySelector('#ok'),msg=m.querySelector('#msg');b.disabled=true;msg.textContent='Saving…';
  try{const o={};for(const f of fields){const el=m.querySelector(`[name="${f[0]}"]`);
   if(f[2]=='image'){if(el.files[0]){if(!AS)throw new Error('Photo upload is not available.');o[f[0]]=(await AS.upload(el.files[0])).url}else o[f[0]]=v[f[0]]||''}else o[f[0]]=el.value}
   if(fields.some(f=>f[2]=='image'&&f[0]=='image')&&!o.image&&title.includes('photo')){throw new Error('Please choose a photo.')}
   await save(o)}catch(e){msg.textContent='Could not save: '+(e.message||e.code||e);b.disabled=false}};
}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;const{a,c,id}=b.dataset;
 if(a=='site')return form('Site info & About text',[['name','Charity name'],['tagline','Tagline'],['about','About us text','area'],['email','Email'],['phone','Phone'],['address','Address']],S.s,async o=>{S.s=o;await commit()});
 if(a=='del'){if(confirm('Remove this item from the website?')){S[c]=S[c].filter(x=>x.id!=id);commit()}return}
 const cur=S[c].find(x=>x.id==id)||{};
 form((id?'Edit ':'Add ')+SCHEMA[c][0],SCHEMA[c][1],cur,async o=>{
  if(id)S[c]=S[c].map(x=>x.id==id?{...x,...o}:x);else S[c]=[...S[c],{id:Date.now().toString(36),...o}];await commit()});
});
addEventListener('hashchange',()=>{render();scrollTo(0,0)});
render();
(async()=>{try{if(!window.claude)return;const u=await claude.use('user');admin=!!(u&&u.canEdit());
 if(admin){A=await claude.use('artifact');AS=await claude.use('assets');if(!A)admin=false;render()}}catch(e){}})();
</script>
</body>
</html>
